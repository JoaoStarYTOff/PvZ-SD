<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="75.40245" height="101.46495" viewBox="0,0,75.40245,101.46495"><defs><linearGradient x1="240.00011" y1="-65.2592" x2="240.00011" y2="34.6777" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#ffe8a2"/><stop offset="1" stop-color="#fffee2"/></linearGradient></defs><g transform="translate(-202.29887,65.90313)"><g stroke-miterlimit="10"><path d="M277.0574,-65.2592v90.47813h-26.44642l-9.59928,9.45877l-10.51924,-9.45877h-27.54965v-90.47813z" fill="url(#color-1)" stroke="#000000" stroke-width="1.28786"/><text transform="translate(222.26043,-52.45888) scale(0.19419,0.30032)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">winglade</tspan></text><text transform="translate(207.96867,-45.73473) scale(0.11798,0.12645)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">when planted, heals plants</tspan><tspan x="0" dy="48px">in a 1x3 area by x1.5, and</tspan><tspan x="0" dy="48px">its current tile by x2. it </tspan><tspan x="0" dy="48px">shoots 3 projectiles in 3</tspan><tspan x="0" dy="48px">lanes, and when damaging</tspan><tspan x="0" dy="48px">the zombies gives 250 coins!</tspan><tspan x="0" dy="48px">but the coin amount reduces</tspan><tspan x="0" dy="48px">by x0.95 every hit... also can</tspan><tspan x="0" dy="48px">be planted over other plants!</tspan></text><text transform="translate(216.65523,12.34144) scale(0.18506,0.19927)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Damage: 5</tspan><tspan x="0" dy="46.150000000000006px">Recharge: 20s</tspan></text></g></g></svg>