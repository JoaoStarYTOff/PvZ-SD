<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="204.38749" height="107.56107" viewBox="0,0,204.38749,107.56107"><defs><linearGradient x1="181.40962" y1="70.30476" x2="181.40962" y2="175.8622" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#ff0000"/></linearGradient></defs><g transform="translate(-79.05744,-69.55476)"><g stroke-miterlimit="10"><path d="M282.69493,70.30479v96.91763h-181.70938l-20.86124,8.63978l5.86628,-24.82666v-80.73078z" fill="url(#color-1)" stroke="#000000" stroke-width="1.5"/><text transform="translate(92.72647,86.82911) scale(0.38008,0.38008)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">PURGATORIO ALEATORIO</tspan></text><text transform="translate(141.38795,92.39515) scale(0.13653,0.13653)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">(Or simply Random Purgatory)</tspan></text><text transform="translate(112.72647,103.12532) scale(0.24953,0.24953)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">You will get 3 gift boxes</tspan><tspan x="0" dy="46.15px">that spawn random plants,</tspan><tspan x="0" dy="46.15px">and 3 sun producers...</tspan><tspan x="0" dy="46.15px">The zombies that will appear</tspan><tspan x="0" dy="46.15px">here are extremely hard to beat,</tspan><tspan x="0" dy="46.15px">but you will get a good reward</tspan></text></g></g></svg>