<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="75.40245" height="101.46495" viewBox="0,0,75.40245,101.46495"><defs><linearGradient x1="240.0001" y1="85.85434" x2="240.0001" y2="-14.08256" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#fffee2"/><stop offset="1" stop-color="#ffe8a2"/></linearGradient></defs><g transform="translate(-202.29888,14.96668)"><g stroke-miterlimit="10"><path d="M202.94281,85.85434v-90.47813h27.54965l10.51924,-9.45877l9.59928,9.45877h26.44642v90.47813z" fill="url(#color-1)" stroke="#000000" stroke-width="1.28786"/><text transform="translate(225.21851,7.30877) scale(0.1824,0.26536)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">CON CHI</tspan></text><text transform="translate(207.35177,19.06684) scale(0.09472,0.16249)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Attack zombies in front of her,</tspan><tspan x="0" dy="48px">with a 10% chance to stun them!</tspan><tspan x="0" dy="48px">Tap her to activate a ThunderClap,</tspan><tspan x="0" dy="48px">which stuns and </tspan><tspan x="0" dy="48px">knockbacks zombies! Pay attention, </tspan><tspan x="0" dy="48px">when her flower blooms, its time!</tspan></text><text transform="translate(215.11298,71.17225) scale(0.18506,0.19927)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Damage: 10</tspan><tspan x="0" dy="46.150000000000006px">Recharge: 15s</tspan></text><text transform="translate(230.64715,12.13627) scale(0.08179,0.119)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">(Or Bun Chi)</tspan></text></g></g></svg>