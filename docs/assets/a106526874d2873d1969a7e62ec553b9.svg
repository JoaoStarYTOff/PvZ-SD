<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="458.39508" height="300.86215" viewBox="0,0,458.39508,300.86215"><g transform="translate(-10.01531,-29.70257)"><g stroke-miterlimit="10"><path d="M79.1541,329.03995v-298.33738h350.89975v298.33738z" fill="#606060" stroke="#000000" stroke-width="2"/><path d="M154.78797,196.5743v-165.74299h167.66168v165.74299z" fill="#959595" stroke="#000000" stroke-width="2"/><path d="M329.21414,329.56472v-298.33738h138.19625v298.33738z" fill="#959595" stroke="#000000" stroke-width="2"/><path d="M11.01531,329.03995v-298.33738h138.19625v298.33738z" fill="#959595" stroke="#000000" stroke-width="2"/><path d="M11.1826,63.05911v-32.2278h455.79322v32.2278z" fill="#959595" stroke="#000000" stroke-width="2"/><text transform="translate(186.82926,56.53677) scale(0.60417,0.60417)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">OPTIONS</tspan></text><text transform="translate(213.00754,84.21329) scale(0.47932,0.47932)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Audio</tspan></text><path d="M155.184,328.64392v-123.38645h167.66167v123.38645z" fill="#959595" stroke="#000000" stroke-width="2"/><text transform="translate(204.19562,226.41165) scale(0.47932,0.47932)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">General</tspan></text><text transform="translate(334.02763,83.81078) scale(0.46913,0.46913)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Miscellaneous</tspan></text><text transform="translate(22.79913,82.76773) scale(0.47932,0.47932)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Performance</tspan></text><path d="M24.99451,319.96075v-116.94089h114.1785v116.94089z" fill="#7b7b7b" stroke="#000000" stroke-width="2"/><text transform="translate(29.06912,214.85894) scale(0.22088,0.23262)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">"Limit zombies in</tspan><tspan x="0" dy="46.150000000000006px">screen" will limit</tspan><tspan x="0" dy="46.150000000000006px">zombies in screen</tspan><tspan x="0" dy="46.150000000000006px">to 100, greatly helping </tspan><tspan x="0" dy="46.150000000000006px">with performance issues.</tspan><tspan x="0" dy="46.150000000000006px">This may cause some</tspan><tspan x="0" dy="46.150000000000006px">bugs and may be con-</tspan><tspan x="0" dy="46.150000000000006px">sidered as cheating, </tspan><tspan x="0" dy="46.150000000000006px">so don't use it unless </tspan><tspan x="0" dy="46.150000000000006px">100% necessary!</tspan></text><path d="M342.14381,321.27757v-114.1785h114.17851v114.1785z" fill="#7b7b7b" stroke="#000000" stroke-width="2"/><text transform="translate(346.74778,221.95799) scale(0.20103,0.24264)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">"Layout mode" will change</tspan><tspan x="0" dy="46.150000000000006px">the way the seed packets</tspan><tspan x="0" dy="46.150000000000006px">look in game. In "Auto", the</tspan><tspan x="0" dy="46.150000000000006px">game will automatically</tspan><tspan x="0" dy="46.150000000000006px">change depending on your</tspan><tspan x="0" dy="46.150000000000006px">device, "Mobile" will always</tspan><tspan x="0" dy="46.150000000000006px">set it to the mobile layout,</tspan><tspan x="0" dy="46.150000000000006px">and "PC" will always set it</tspan><tspan x="0" dy="46.150000000000006px">to the PC layout.</tspan></text></g></g></svg>